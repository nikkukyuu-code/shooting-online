<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="theme-color" content="#1a0a08" />
  <title>横スクロール シューティング オンライン対戦</title>
  <meta name="description" content="横スクロールシューティングのオンライン対戦ゲーム。敵を倒してアイテムを取得し、対戦相手と勝負しよう。" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css?v=1.5.3" />
</head>
<body>
  <div id="app">
    <section id="screen-menu" class="screen active">
      <div class="sky"></div>
      <div class="menu-panel">
        <button type="button" id="btn-find" class="menu-btn">対戦相手を探す</button>
        <input type="text" id="field-find-status" class="menu-field" readonly placeholder="" />
        <button type="button" id="btn-create" class="menu-btn">部屋を作る</button>
        <input type="text" id="field-room-code" class="menu-field" readonly placeholder="" />
        <button type="button" id="btn-start" class="menu-btn">スタート</button>
        <input type="text" id="input-room-name" class="menu-field room-name" maxlength="12" autocomplete="off" enterkeyhint="go" placeholder="" />
      </div>
      <p class="menu-hint">部屋名を入れて「スタート」で入室 / 「部屋を作る」でホスト</p>
      <div id="app-meta" class="app-meta">
        <span id="app-version">v1.5.3</span>
        <span class="meta-sep">·</span>
        <span id="app-visits">アクセス …</span>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <canvas id="game" width="390" height="700"></canvas>
      <div id="ui-overlay">
        <button type="button" id="btn-stop" class="stop-btn">ストップ</button>
        <div id="game-version" class="game-version">v1.5.3</div>
        <div id="status-bar" class="status-bar">対戦相手を待っています</div>
      </div>
      <div id="end-overlay" class="end-overlay hidden">
        <p id="end-message"></p>
        <button type="button" id="btn-again" class="menu-btn">メニューへ</button>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/main.js?v=1.5.3"></script>
</body>
</html>
