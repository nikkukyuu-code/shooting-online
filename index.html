<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="theme-color" content="#1a0a08" />
  <title>スペーストリックバトル</title>
  <meta name="description" content="スペーストリックバトル — オンライン対戦シューティング。敵を倒してアイテムを取得し、対戦相手と勝負しよう。" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css?v=1.5.73" />
</head>
<body>
  <div id="app">
    <section id="screen-menu" class="screen active">
      <div class="sky sky-space" aria-hidden="true"></div>
      <div class="menu-pt" id="menu-pt" aria-live="polite">PT: 0</div>
      <div class="menu-hero">
        <img class="menu-hero-art" src="assets/title-hero.svg?v=1.5.73" alt="" width="480" height="220" decoding="async" />
        <header class="menu-brand">
          <h1 class="game-title">スペーストリックバトル</h1>
          <p class="game-subtitle">オンライン対戦</p>
        </header>
      </div>
      <div class="menu-center">
      <div class="menu-panel">
        <button type="button" id="btn-cpu" class="menu-btn primary">CPU対戦</button>
        <button type="button" id="btn-find" class="menu-btn">対戦相手を探す</button>
        <input type="text" id="field-find-status" class="menu-field" readonly placeholder="" />
        <button type="button" id="btn-create" class="menu-btn">部屋を作る</button>
        <input type="text" id="field-room-code" class="menu-field" readonly placeholder="" />
        <button type="button" id="btn-start" class="menu-btn">入室</button>
        <input type="text" id="input-room-name" class="menu-field room-name" maxlength="12" autocomplete="off" enterkeyhint="go" placeholder="" />
        <div class="menu-row">
          <button type="button" id="btn-deck" class="menu-btn menu-btn-sub">デッキ</button>
          <button type="button" id="btn-shop" class="menu-btn menu-btn-sub">ショップ</button>
        </div>
        <div class="menu-row">
          <button type="button" id="btn-zukan" class="menu-btn menu-btn-sub">図鑑</button>
          <button type="button" id="btn-tutorial" class="menu-btn menu-btn-sub">チュートリアル</button>
        </div>
      </div>
      </div>
      <div class="menu-footer">
        <p class="menu-hint">部屋名を入れて「入室」でゲスト入室 / 「部屋を作る」でホスト待機</p>
        <div id="app-meta" class="app-meta">
          <span id="app-version">v1.5.73</span>
          <span class="meta-sep">·</span>
          <span id="app-visits">アクセス …</span>
        </div>
      </div>
    </section>

    <section id="screen-deck" class="screen sub-screen">
      <div class="sky"></div>
      <div class="sub-panel">
        <header class="sub-head">
          <h2>デッキ編集</h2>
          <p class="sub-desc">送信する敵を<strong>5体・重複なし</strong>で装備</p>
        </header>
        <h3 class="sub-section-title deck-equipped-heading">装備中デッキ</h3>
        <div id="deck-slots" class="deck-slots" aria-label="装備中デッキ"></div>
        <p id="deck-hint" class="sub-hint">スロットを選んでから、下の所持ユニットをタップして入れ替え</p>
        <div id="deck-detail" class="unit-detail" aria-live="polite"></div>
        <h3 class="sub-section-title">所持ユニット</h3>
        <div id="deck-owned" class="unit-grid"></div>
        <details class="intro-panel" id="deck-items-intro">
          <summary>アイテム紹介</summary>
          <div id="deck-items-list" class="items-intro-list"></div>
        </details>
        <button type="button" id="btn-deck-back" class="menu-btn">メニューへ</button>
      </div>
    </section>

    <section id="screen-shop" class="screen sub-screen">
      <div class="sky"></div>
      <div class="sub-panel">
        <header class="sub-head">
          <h2>ショップ</h2>
          <p class="sub-desc">PTで送信ユニットを解放　<span id="shop-pt">PT: 0</span></p>
        </header>
        <div id="shop-detail" class="unit-detail" aria-live="polite"></div>
        <div class="shop-buy-row">
          <button type="button" id="btn-shop-buy" class="menu-btn primary shop-buy-btn">購入</button>
          <p id="shop-msg" class="shop-msg" role="status" aria-live="polite" hidden></p>
        </div>
        <div id="shop-list" class="unit-grid shop-grid"></div>
        <details class="intro-panel" id="shop-items-intro">
          <summary>アイテム紹介</summary>
          <div id="shop-items-list" class="items-intro-list"></div>
        </details>
        <button type="button" id="btn-shop-back" class="menu-btn">メニューへ</button>
      </div>
    </section>

    <section id="screen-zukan" class="screen sub-screen">
      <div class="sky"></div>
      <div class="sub-panel">
        <header class="sub-head">
          <h2>図鑑</h2>
          <p class="sub-desc">ユニットの攻撃パターンとバトルアイテム</p>
        </header>
        <div class="zukan-tabs" role="tablist">
          <button type="button" class="zukan-tab active" data-tab="units" id="zukan-tab-units">ユニット</button>
          <button type="button" class="zukan-tab" data-tab="items" id="zukan-tab-items">アイテム</button>
        </div>
        <div id="zukan-unit-detail" class="unit-detail"></div>
        <div id="zukan-units" class="unit-grid shop-grid"></div>
        <div id="zukan-items" class="items-intro-list hidden"></div>
        <button type="button" id="btn-zukan-back" class="menu-btn">メニューへ</button>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <canvas id="game" width="390" height="700"></canvas>
      <div id="ui-overlay">
        <button type="button" id="btn-stop" class="stop-btn">ストップ</button>
        <div id="game-version" class="game-version">v1.5.73</div>
        <div id="status-bar" class="status-bar">対戦相手を待っています</div>
      </div>
      <div id="end-overlay" class="end-overlay hidden">
        <p id="end-message"></p>
        <button type="button" id="btn-again" class="menu-btn">メニューへ</button>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/main.js?v=1.5.73"></script>
</body>
</html>
